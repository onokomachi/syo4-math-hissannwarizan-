<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>筆算の割り算</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===================== ホーム ===================== -->
  <section data-screen="home" class="active">
    <div class="home-top">
      <div class="home-title-area">
        <div class="home-title">筆算の割り算</div>
        <div class="home-subtitle">小学４年生</div>
      </div>
      <div id="difficulty-badge" class="diff-badge">2けた・あまりなし</div>
    </div>

    <div class="home-modes">
      <button class="mode-card card-blue" onclick="App.navigate('tutorial')">
        <span class="mc-icon">📖</span>
        <span class="mc-title">れいだい</span>
        <span class="mc-sub">手順を見てみよう</span>
      </button>
      <button class="mode-card card-green" onclick="App.navigate('practice',{testMode:false})">
        <span class="mc-icon">✏️</span>
        <span class="mc-title">れんしゅう</span>
        <span class="mc-sub">ヒントあり</span>
      </button>
      <button class="mode-card card-purple" onclick="App.navigate('practice',{testMode:true})">
        <span class="mc-icon">⏱️</span>
        <span class="mc-title">テスト</span>
        <span class="mc-sub">ヒントなし</span>
      </button>
      <button class="mode-card card-orange" onclick="App.navigate('progress')">
        <span class="mc-icon">📊</span>
        <span class="mc-title">きろく</span>
        <span class="mc-sub">これまでのせいせき</span>
      </button>
    </div>

    <div class="home-settings">
      <div class="setting-group">
        <span class="setting-label">何けた？</span>
        <div class="setting-btns">
          <button class="digit-btn" data-digits="2" onclick="App.setDifficulty(2, App.getDifficulty().remainder)">２けた</button>
          <button class="digit-btn" data-digits="3" onclick="App.setDifficulty(3, App.getDifficulty().remainder)">３けた</button>
        </div>
      </div>
      <div class="setting-divider"></div>
      <div class="setting-group">
        <span class="setting-label">あまりは？</span>
        <div class="setting-btns">
          <button class="remainder-btn" data-remainder="false" onclick="App.setDifficulty(App.getDifficulty().digits, false)">なし</button>
          <button class="remainder-btn" data-remainder="true"  onclick="App.setDifficulty(App.getDifficulty().digits, true)">あり</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ================ チュートリアル ================= -->
  <section data-screen="tutorial" id="tutorial-screen">
    <header class="screen-hdr">
      <button class="back-btn" onclick="App.navigate('home')">◀ もどる</button>
      <div class="hdr-title">
        <ruby>例題<rt>れいだい</rt></ruby>：手順を学ぼう
      </div>
      <div class="hdr-right" id="tutorial-problem-display"></div>
    </header>

    <div class="split-layout">
      <!-- Left: grid -->
      <div class="grid-panel">
        <div class="division-grid" id="tutorial-grid"></div>
      </div>

      <!-- Right: controls -->
      <aside class="side-panel">
        <div class="mnemonic-bar" id="tutorial-mnemonic">
          <div class="mnemonic-pill" data-kind="tateru"><b>た</b>てる</div>
          <div class="mnemonic-pill" data-kind="kakeru"><b>か</b>ける</div>
          <div class="mnemonic-pill" data-kind="hiku"><b>ひ</b>く</div>
          <div class="mnemonic-pill" data-kind="orosu"><b>お</b>ろす</div>
        </div>

        <div class="step-counter" id="tutorial-step-counter">ステップ 0 / 0</div>

        <div class="speech-bubble" id="tutorial-speech">
          「つぎへ」を押して手順を見てみよう！
        </div>

        <div class="btn-row">
          <button class="btn-secondary" id="tutorial-prev-btn" onclick="Tutorial.prevStep()" disabled>◀ もどる</button>
          <button class="btn-primary" id="tutorial-next-btn" onclick="Tutorial.nextStep()">つぎへ ▶</button>
        </div>

        <button class="btn-autoplay" id="tutorial-autoplay-btn" onclick="Tutorial.toggleAutoplay()">▶ じどう</button>

        <div class="answer-box" id="tutorial-answer" style="display:none;">
          答え：<strong id="tutorial-answer-val"></strong>
        </div>
      </aside>
    </div>
  </section>

  <!-- =============== 練習・テスト ================= -->
  <section data-screen="practice" id="practice-screen">
    <header class="screen-hdr">
      <button class="back-btn" onclick="App.navigate('home')">◀ もどる</button>
      <div class="hdr-title" id="practice-title">れんしゅう</div>
      <div class="hdr-right practice-hdr-right">
        <span id="practice-problem-label" class="problem-label"></span>
        <span id="practice-timer" class="timer-display" style="display:none;">00:00</span>
      </div>
    </header>

    <div class="split-layout">
      <!-- Left: grid -->
      <div class="grid-panel">
        <div class="division-grid" id="practice-grid"></div>
      </div>

      <!-- Right: numpad + controls -->
      <aside class="side-panel">
        <div class="mnemonic-bar">
          <div class="mnemonic-pill" data-kind="tateru"><b>た</b>てる</div>
          <div class="mnemonic-pill" data-kind="kakeru"><b>か</b>ける</div>
          <div class="mnemonic-pill" data-kind="hiku"><b>ひ</b>く</div>
          <div class="mnemonic-pill" data-kind="orosu"><b>お</b>ろす</div>
        </div>

        <div class="instruction-box" id="practice-instruction">
          問題を読んで、数を入れてみよう！
        </div>

        <div class="numpad" id="numpad">
          <button class="np-btn" onclick="Practice.numpadInput(7)">7</button>
          <button class="np-btn" onclick="Practice.numpadInput(8)">8</button>
          <button class="np-btn" onclick="Practice.numpadInput(9)">9</button>
          <button class="np-btn" onclick="Practice.numpadInput(4)">4</button>
          <button class="np-btn" onclick="Practice.numpadInput(5)">5</button>
          <button class="np-btn" onclick="Practice.numpadInput(6)">6</button>
          <button class="np-btn" onclick="Practice.numpadInput(1)">1</button>
          <button class="np-btn" onclick="Practice.numpadInput(2)">2</button>
          <button class="np-btn" onclick="Practice.numpadInput(3)">3</button>
          <button class="np-btn np-zero" onclick="Practice.numpadInput(0)">0</button>
          <button class="np-btn np-back" onclick="Practice.numpadBackspace()">⌫</button>
        </div>

        <button class="btn-hint" id="hint-btn" onclick="Practice.showHint()">
          💡 ヒント
        </button>
      </aside>
    </div>
  </section>

  <!-- =================== 結果 ===================== -->
  <section data-screen="result">
    <div class="result-wrapper">
      <div class="result-card">
        <div class="result-icon" id="result-icon">🎉</div>
        <div class="result-title" id="result-title">せいかい！</div>
        <div class="result-equation" id="result-problem"></div>
        <div class="result-stats">
          <div class="stat-box">
            <div class="stat-lbl">じかん</div>
            <div class="stat-val" id="result-time">--</div>
          </div>
          <div class="stat-box">
            <div class="stat-lbl">ヒント</div>
            <div class="stat-val" id="result-hints">0回</div>
          </div>
        </div>
        <div class="result-bonus" id="result-bonus" style="display:none;"></div>
        <div class="btn-row result-btns">
          <button class="btn-primary" onclick="App.navigate('practice',{testMode:Practice.wasTestMode})">もう一問</button>
          <button class="btn-secondary" onclick="App.navigate('home')">ホームへ</button>
        </div>
      </div>
    </div>
  </section>

  <!-- =================== きろく =================== -->
  <section data-screen="progress">
    <header class="screen-hdr">
      <button class="back-btn" onclick="App.navigate('home')">◀ もどる</button>
      <div class="hdr-title">きろく</div>
    </header>
    <div class="progress-wrapper">
      <div class="progress-grid" id="progress-content"></div>
      <button class="btn-danger" onclick="App.clearProgress()">きろくをリセット</button>
    </div>
  </section>

</div><!-- #app -->

<script src="js/division.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/practice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
